<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>뮤린이 출석 체크</title>
<style>
  :root{
    --pink:#ff6f9c;
    --pink-dark:#ff4f86;
    --purple:#8b6ef2;
    --gold:#ffc94a;
    --cream:#fff8ef;
    --ink:#3a2e4d;
    --card:#ffffff;
    --gray:#9a8fae;
    --shadow: 0 10px 25px rgba(139,110,242,0.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    background: radial-gradient(circle at 20% 0%, #ffe1ec 0%, transparent 55%),
                radial-gradient(circle at 90% 10%, #efe6ff 0%, transparent 50%),
                linear-gradient(180deg, #fff8ef 0%, #fff1f6 100%);
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:20px 16px 40px;
    position:relative;
  }
  /* ---------- header ---------- */
  .header{
    text-align:center;
    margin-bottom:18px;
  }
  .header .emoji-row{ font-size:26px; margin-bottom:2px; }
  .header h1{
    font-size:22px;
    margin:2px 0 4px;
    font-weight:800;
    letter-spacing:-0.3px;
  }
  .header p{
    margin:0;
    font-size:13px;
    color:var(--gray);
  }
  /* ---------- loading ---------- */
  .loading{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:80px 0;
    color:var(--gray);
    gap:12px;
  }
  .spinner{
    width:38px;height:38px;
    border-radius:50%;
    border:4px solid #f1e6ff;
    border-top-color: var(--purple);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .error-box{
    background:#fff0f0;
    border:1px solid #ffd2d2;
    color:#c0392b;
    padding:14px 16px;
    border-radius:14px;
    font-size:13px;
    line-height:1.6;
    margin-top:16px;
  }
  .error-box button{ margin-top:8px; }

  /* ---------- search ---------- */
  .search-wrap{
    position:relative;
    margin-bottom:14px;
  }
  .search-wrap input{
    width:100%;
    padding:14px 16px 14px 42px;
    border-radius:18px;
    border:2px solid #ffe0ea;
    background:var(--card);
    font-size:15px;
    outline:none;
    box-shadow: var(--shadow);
    transition: border-color .15s;
  }
  .search-wrap input:focus{ border-color: var(--pink); }
  .search-wrap .icon{
    position:absolute;
    left:15px; top:50%;
    transform:translateY(-50%);
    font-size:16px;
    opacity:.6;
  }

  /* ---------- member list ---------- */
  .member-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .member-card{
    background:var(--card);
    border-radius:18px;
    padding:14px 16px;
    box-shadow: var(--shadow);
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    transition: transform .12s ease;
    border: 2px solid transparent;
  }
  .member-card:active{ transform: scale(0.97); }
  .member-card.danger{ border-color:#ffd2d2; background:#fff8f8; }
  .member-name{
    font-weight:700;
    font-size:15.5px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .member-name .badge{
    font-size:10px;
    font-weight:700;
    padding:2px 7px;
    border-radius:20px;
    background:#fff0e0;
    color:#c07a1a;
  }
  .hearts{ font-size:16px; letter-spacing:2px; white-space:nowrap; }
  .hearts .dim{ opacity:.22; }
  .empty-msg{
    text-align:center;
    color:var(--gray);
    padding:50px 10px;
    font-size:14px;
    line-height:1.7;
  }

  /* ---------- detail view ---------- */
  .detail{
    animation: slideUp .25s ease;
  }
  @keyframes slideUp{ from{ opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .back-btn{
    background:none;
    border:none;
    color:var(--purple);
    font-size:14px;
    font-weight:700;
    padding:8px 0 14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .detail-hero{
    background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 100%);
    border-radius:22px;
    padding:26px 20px;
    text-align:center;
    color:#fff;
    box-shadow: var(--shadow);
    margin-bottom:20px;
  }
  .detail-hero h2{ margin:0 0 6px; font-size:20px; font-weight:800; }
  .detail-hero .join-info{ font-size:12.5px; opacity:.9; margin-bottom:12px; }
  .detail-hero .hearts-big{ font-size:28px; letter-spacing:5px; }
  .detail-hero .hearts-big .dim{ opacity:.35; }
  .detail-hero .life-caption{ font-size:12px; margin-top:6px; opacity:.9; }

  .section-title{
    font-size:14px;
    font-weight:800;
    color:var(--ink);
    margin: 4px 0 10px 2px;
    display:flex;
    align-items:center;
    gap:6px;
  }

  /* ---------- carousel (월별 이동) ---------- */
  .carousel-wrap{
    position:relative;
    display:flex;
    align-items:stretch;
    gap:10px;
    margin-bottom:10px;
  }
  .nav-btn{
    background: linear-gradient(135deg, #ffffff, #f4edff);
    border:none;
    width:52px;height:52px;
    border-radius:18px;
    box-shadow: var(--shadow);
    font-size:24px;
    font-weight:800;
    color:var(--purple);
    cursor:pointer;
    flex-shrink:0;
    align-self:center;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .nav-btn:active{ transform: scale(0.88); }
  .nav-btn:disabled{ opacity:.25; }
  .month-group{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:10px;
    touch-action: pan-y;
  }
  .month-group-label{
    text-align:center;
    font-size:15px;
    font-weight:800;
    color:var(--ink);
  }
  .month-cards{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .month-card{
    background:var(--card);
    border-radius:18px;
    box-shadow: var(--shadow);
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:14px;
    user-select:none;
    border:2px solid transparent;
    transition: border-color .15s, opacity .15s;
  }
  .month-card.checked{ border-color:#ffd0a8; background:#fffaf3; }
  .month-card.locked{ opacity:.65; }
  .month-card.loading{ opacity:.8; }
  .spinner.small{ width:26px; height:26px; border-width:3px; }
  .month-card .card-top{
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .month-card .stamp{
    font-size:24px;
    line-height:1.3;
    flex-shrink:0;
  }
  .month-card .session-info{
    flex:1;
    min-width:0;
  }
  .month-card .session-title{
    font-size:14.5px;
    font-weight:800;
    color:var(--ink);
    line-height:1.4;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  .month-card .card-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .month-card .month-status{
    font-size:12px;
    color:var(--gray);
  }
  .checkin-btn{
    flex-shrink:0;
    white-space:nowrap;
    border:none;
    border-radius:14px;
    padding:10px 16px;
    font-size:13px;
    font-weight:800;
    color:#fff;
    background: linear-gradient(135deg, var(--purple), var(--pink-dark));
    box-shadow: 0 6px 14px rgba(255,79,134,0.28);
    cursor:pointer;
    transition: transform .12s ease;
  }
  .checkin-btn:active{ transform: scale(0.92); }
  .checkin-btn:disabled{ opacity:.6; }
  .checkin-btn.done{
    background:#fff;
    color:var(--pink-dark);
    border:2px solid #ffd0a8;
    box-shadow:none;
  }
  .dots{
    display:flex;
    justify-content:center;
    gap:5px;
    margin-bottom:20px;
    flex-wrap:wrap;
    max-width:100%;
  }
  .dots span{
    width:6px;height:6px;border-radius:50%;
    background:#eadbff;
  }
  .dots span.active{ background:var(--purple); }
  .dots span.done{ background:var(--gold); }

  /* ---------- confetti ---------- */
  .confetti-layer{
    position:fixed;
    left:0; top:0;
    width:100%; height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:9999;
  }
  .confetti-piece{
    position:fixed;
    border-radius:2px;
    opacity:1;
    animation: confetti-burst 900ms cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes confetti-burst{
    0%{ transform: translate(0,0) rotate(0deg); opacity:1; }
    65%{ opacity:1; }
    100%{ transform: translate(var(--dx), calc(var(--dy) + 170px)) rotate(var(--rot)); opacity:0; }
  }

  .toast{
    position:fixed;
    left:50%; bottom:26px;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:30px;
    font-size:13px;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
    opacity:0;
    pointer-events:none;
    transition: opacity .2s, transform .2s;
    z-index:60;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  .no-session{
    background:#fff;
    border-radius:18px;
    box-shadow: var(--shadow);
    padding:26px 18px;
    text-align:center;
    color:var(--gray);
    font-size:13.5px;
    line-height:1.7;
  }

  /* ---------- admin fab + modal ---------- */
  .fab{
    position:fixed;
    right:calc(50% - 240px + 16px);
    bottom:18px;
    width:44px;height:44px;
    border-radius:50%;
    background:var(--card);
    box-shadow: var(--shadow);
    border:none;
    font-size:18px;
    cursor:pointer;
    z-index:40;
  }
  @media (max-width:512px){
    .fab{ right:16px; }
  }
  .overlay{
    position:fixed; inset:0;
    background:rgba(58,46,77,0.45);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:80;
    opacity:0; pointer-events:none;
    transition:opacity .2s;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%;
    max-width:480px;
    background:var(--cream);
    border-radius:24px 24px 0 0;
    padding:20px 20px 28px;
    max-height:82vh;
    overflow-y:auto;
    transform:translateY(20px);
    transition:transform .2s;
  }
  .overlay.show .sheet{ transform:translateY(0); }
  .sheet h3{ margin:0 0 14px; font-size:17px; font-weight:800; }
  .sheet label{ font-size:12.5px; color:var(--gray); font-weight:700; display:block; margin:12px 0 5px; }
  .sheet input{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:2px solid #f0e4f9;
    font-size:14px;
    outline:none;
    background:#fff;
  }
  .sheet input:focus{ border-color:var(--purple); }
  .btn{
    display:block;
    width:100%;
    padding:13px;
    border-radius:14px;
    border:none;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
    margin-top:14px;
  }
  .btn-primary{ background:var(--pink); color:#fff; }
  .btn-secondary{ background:#eee3ff; color:var(--purple); }
  .btn-ghost{ background:none; color:var(--gray); font-weight:600; }
  .btn:disabled{ opacity:.65; cursor:not-allowed; }
  .btn-spinner{
    display:inline-block;
    width:12px;height:12px;
    border-radius:50%;
    border:2px solid currentColor;
    border-top-color:transparent;
    opacity:.85;
    animation:spin .7s linear infinite;
    vertical-align:-2px;
    margin-right:6px;
  }
  .close-x{
    position:absolute; top:14px; right:16px;
    background:none;border:none;font-size:18px;color:var(--gray);cursor:pointer;
  }
  .admin-section{
    background:#fff;
    border-radius:16px;
    padding:14px 16px;
    margin-top:14px;
  }
  .admin-member-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0;
    border-bottom:1px solid #f4eefc;
    font-size:13.5px;
  }
  .admin-member-row:last-child{ border-bottom:none; }
  .admin-member-row button{
    background:#fff0f0; color:#d9534f; border:none;
    padding:5px 10px; border-radius:10px; font-size:11.5px; font-weight:700; cursor:pointer;
  }
  .hint{ font-size:11.5px; color:var(--gray); margin-top:6px; line-height:1.5; }
  .divider{ height:1px; background:#f0e4f9; margin:18px 0; }

  /* ---------- 모임(세션) 관리 리스트 ---------- */
  .session-add-row{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .session-add-row input{ flex:1; min-width:0; }
  .session-add-row input.month-input{ flex:0 0 92px; }
  .session-list{ margin-top:16px; }
  .session-month-group{ margin-bottom:10px; }
  .session-month-group:last-child{ margin-bottom:0; }
  .session-month-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin:0 0 6px 2px;
  }
  .session-month-title{
    font-size:12px;
    font-weight:800;
    color:var(--gray);
  }
  .mini-btn.month-close{ background:#fff2d6; color:#a8760a; }
  .admin-session-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:9px 0;
    border-bottom:1px solid #f4eefc;
    font-size:13.5px;
  }
  .admin-session-row:last-child{ border-bottom:none; }
  .session-row-label{
    display:flex;
    align-items:center;
    gap:6px;
    flex:1;
    min-width:0;
    overflow-wrap:anywhere;
  }
  .badge-status{
    font-size:10px;
    font-weight:700;
    padding:2px 7px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge-status.open{ background:#e9f7ec; color:#2f9e52; }
  .badge-status.closed{ background:#f1eef7; color:#8b7fa3; }
  .row-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .mini-btn{
    background:#eee3ff; color:var(--purple); border:none;
    padding:6px 10px; border-radius:10px; font-size:11.5px; font-weight:700; cursor:pointer;
    white-space:nowrap;
  }
  .mini-btn.danger{ background:#fff0f0; color:#d9534f; }
  .mini-btn:disabled{ opacity:.6; cursor:not-allowed; }
  .admin-session-row.editing{
    flex-direction:column;
    align-items:stretch;
    gap:8px;
  }
  .admin-session-row.editing input{
    margin-bottom:0;
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="header">
    <div class="emoji-row">🎭🎟️✨</div>
    <h1>뮤린이 출석 체크</h1>
    <p>내 이름을 찾아서 이번 달 참여를 체크해보세요</p>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>불러오는 중...</div>
    </div>
  </div>

</div>

<button class="fab" id="adminFab" title="관리자">⚙️</button>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   설정
========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbyJu1fH6ttuVmkhdUOQXWpnaTVgldlp8v0VFaIbINQty6pkAMg3_ZhwgwW0cRNFGIzP/exec";
const MAX_LIVES = 3;

/* =========================================================
   상태
========================================================= */
let state = {
  members: [],
  sessions: [],
  attendance: [],
  selectedMember: null,
  monthIndex: 0,
  adminToken: null,
  checkInPending: false,
  editingSessionId: null
};

const $content = document.getElementById("content");
const $overlay = document.getElementById("overlay");
const $sheet = document.getElementById("sheet");
const $toast = document.getElementById("toast");

/* =========================================================
   유틸
========================================================= */
function showToast(msg, ms){
  $toast.textContent = msg;
  $toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> $toast.classList.remove("show"), ms || 1800);
}

function currentMonthStr(){
  const d = new Date();
  const m = (d.getMonth()+1).toString().padStart(2,"0");
  return d.getFullYear() + "-" + m;
}

function monthLabel(m){
  if(!m) return "";
  const [y,mo] = m.split("-");
  return y + "년 " + parseInt(mo,10) + "월";
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}

// 버튼 이중 클릭 방지 + 전송 중 로딩 표시
function setBtnLoading(btn, loadingText){
  if(!btn || btn.dataset.loading) return;
  btn.dataset.loading = "1";
  btn.dataset.origHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="btn-spinner"></span>${escapeHtml(loadingText || "처리 중...")}`;
}
function resetBtnLoading(btn){
  if(!btn || !btn.dataset.loading) return;
  btn.disabled = false;
  btn.innerHTML = btn.dataset.origHtml || btn.innerHTML;
  delete btn.dataset.loading;
  delete btn.dataset.origHtml;
}

async function api(action, payload){
  const body = Object.assign({ action }, payload || {});
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  });
  const json = await res.json();
  if(!json.ok){
    throw new Error(json.error || "알 수 없는 오류가 발생했어요");
  }
  return json;
}

async function loadData(){
  const res = await fetch(API_URL, { method:"GET" });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || "데이터를 불러오지 못했어요");
  state.members = json.members || [];
  state.sessions = (json.sessions || []).slice().sort((a,b)=>{
    if(a.month !== b.month) return a.month < b.month ? -1 : 1;
    return String(a.title||"").localeCompare(String(b.title||""), "ko");
  });
  state.attendance = json.attendance || [];
}

/* =========================================================
   모임(세션) 목록 헬퍼
========================================================= */
// 특정 멤버가 볼 수 있는 모임 목록 (가입월 이후, 월 순 정렬)
function sessionsForMember(member){
  return state.sessions.filter(s => s.month >= member.joinMonth);
}

// 모임 목록을 월별로 그룹핑 (최신 월이 먼저 오도록 정렬)
function groupSessionsByMonth(sessions){
  const map = {};
  sessions.forEach(s => {
    if(!map[s.month]) map[s.month] = [];
    map[s.month].push(s);
  });
  return Object.keys(map).sort().reverse().map(month => ({
    month,
    items: map[month].slice().sort((a,b)=> String(a.title||"").localeCompare(String(b.title||""), "ko"))
  }));
}

// 멤버 상세 화면(월별 이동 캐러셀)용: 오래된 월 → 최신 월 순서로 그룹핑
// (sessions 는 이미 월 오름차순으로 정렬되어 들어오므로 그 순서를 그대로 유지)
function monthGroupsFor(sessions){
  const map = {};
  const order = [];
  sessions.forEach(s => {
    if(!map[s.month]){ map[s.month] = []; order.push(s.month); }
    map[s.month].push(s);
  });
  return order.map(month => ({ month, items: map[month] }));
}

/* =========================================================
   라이프(하트) 계산 — 백엔드 closeMonthAndFlag 와 동일한 로직
   (한 달에 모임이 여러 개일 수 있으므로, "그 달에 하나라도 참여했는지"로 판정)
========================================================= */
function distinctClosedMonthsFor(member){
  return Array.from(new Set(
    state.sessions
      .filter(s => (s.closed === true || s.closed === "TRUE") && s.month >= member.joinMonth)
      .map(s => s.month)
  )).sort();
}

function attendedMonthsSet(memberId){
  return new Set(
    state.attendance.filter(a => a.memberId === memberId).map(a => a.month)
  );
}

function currentStreak(member){
  const months = distinctClosedMonthsFor(member);
  const attended = attendedMonthsSet(member.id);
  let streak = 0;
  for(let i = months.length - 1; i >= 0; i--){
    if(attended.has(months[i])) break;
    streak++;
  }
  return streak;
}

function livesFor(member){
  return Math.max(0, MAX_LIVES - currentStreak(member));
}

function heartsHtml(lives, size){
  let out = "";
  for(let i=0;i<MAX_LIVES;i++){
    out += i < lives ? "❤️" : '<span class="dim">🖤</span>';
  }
  return out;
}

  function renderList(query){
    const q = (query || "").trim();
    const filtered = q
      ? activeMembers.filter(m => m.name && m.name.includes(q))
      : activeMembers;

    if(activeMembers.length === 0){
      $list.innerHTML = `<div class="empty-msg">아직 등록된 멤버가 없어요.<br/>운영진에게 등록을 요청해주세요 🙏</div>`;

      return;

    $list.innerHTML = filtered.map(m => {

      const danger = lives <= 1 ? "danger" : "";
      return `
        <div class="member-card ${danger}" data-id="${m.id}">

        const id = card.getAttribute("data-id");
        const member = state.members.find(m => m.id === id);

  renderList("");
  $input.addEventListener("input", (e) => renderList(e.target.value));

function openDetail(member){
  state.selectedMember = member;
  const sessions = sessionsForMember(member);

  // 이번 달을 기본으로 보여주되, 없으면 가장 마지막 월
  const groups = monthGroupsFor(sessions);
  const cm = currentMonthStr();
  let idx = groups.findIndex(g => g.month === cm);
  if(idx === -1) idx = groups.length - 1;
  state.monthIndex = idx;

  renderDetail(sessions);
}

function renderDetail(sessions){
  const member = state.selectedMember;
  const lives = livesFor(member);

  $content.innerHTML = `
    <div class="detail">
      <button class="back-btn" id="backBtn">‹ 목록으로</button>
      <div class="detail-hero">
        <h2>${escapeHtml(member.name)} 님</h2>
        <div class="join-info">${monthLabel(member.joinMonth)}부터 함께하고 있어요</div>
        <div class="hearts-big">${heartsHtml(lives)}</div>

      </div>
      <div class="section-title">📅 모임별 참여 내역</div>
      <div id="carouselArea"></div>
    </div>
  `;

  document.getElementById("backBtn").addEventListener("click", renderMain);
  renderCarousel(sessions);

function renderCarousel(sessions){
  const $area = document.getElementById("carouselArea");
  const member = state.selectedMember;

  if(sessions.length === 0){
    $area.innerHTML = `
      <div class="no-session">
        아직 열린 모임이 없어요.<br/>
        운영진이 모임을 등록하면 여기에 표시돼요 🎬
      </div>
    `;
    return;
  }

  const groups = monthGroupsFor(sessions);
  if(state.monthIndex < 0) state.monthIndex = 0;
  if(state.monthIndex > groups.length - 1) state.monthIndex = groups.length - 1;

  const idx = state.monthIndex;
  const group = groups[idx];

  const isAttended = (s) => state.attendance.some(a => a.memberId === member.id && a.sessionId === s.id);

  const cardsHtml = group.items.map(session => {
    const isClosed = session.closed === true || session.closed === "TRUE";
    const attended = isAttended(session);
    return `
      <div class="month-card ${attended ? "checked" : ""} ${isClosed ? "locked" : ""}" data-session-id="${session.id}">
        <div class="card-top">
          <div class="stamp">${attended ? "🎉" : (isClosed ? "😢" : "🎫")}</div>
          <div class="session-info">
            <div class="session-title">${escapeHtml(session.title || "")}</div>
          </div>
        </div>
        <div class="card-bottom">
          <div class="month-status">
            ${attended ? "참여 완료!" : (isClosed ? "참여 기록 없음 (마감됨)" : "아직 체크 전이에요")}
          </div>
          ${isClosed ? "" : `<button class="checkin-btn ${attended ? "done" : ""}" data-session-id="${session.id}">${attended ? "취소하기" : "체크하기"}</button>`}
        </div>
      </div>
    `;
  }).join("");

  $area.innerHTML = `
    <div class="carousel-wrap">
      <button class="nav-btn" id="prevBtn" ${idx===0 ? "disabled" : ""}>‹</button>
      <div class="month-group" id="monthGroup">
        <div class="month-group-label">${monthLabel(group.month)}</div>
        <div class="month-cards">${cardsHtml}</div>
      </div>
      <button class="nav-btn" id="nextBtn" ${idx===groups.length-1 ? "disabled" : ""}>›</button>
    </div>
    <div class="dots">
      ${groups.map((g,i) => {
        const allDone = g.items.every(isAttended);
        const cls = i===idx ? "active" : (allDone ? "done" : "");
        return `<span class="${cls}"></span>`;
      }).join("")}
    </div>
  `;

  document.getElementById("prevBtn").addEventListener("click", () => {
    state.monthIndex--; renderCarousel(sessions);
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    state.monthIndex++; renderCarousel(sessions);
  });

  $area.querySelectorAll(".checkin-btn").forEach($btn => {
    $btn.addEventListener("click", () => {
      const sessionId = $btn.getAttribute("data-session-id");
      const session = sessions.find(s => s.id === sessionId);
      if(session) toggleCheckIn(session, sessions, $btn);
    });
  });

  // 스와이프 (월 이동)
  const $group = document.getElementById("monthGroup");
  let startX = null;
  $group.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; }, {passive:true});
  $group.addEventListener("touchend", (e) => {
    if(startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    startX = null;
    if(Math.abs(dx) < 40) return; // 너무 짧으면 탭으로 처리
    if(dx < 0 && idx < groups.length - 1){ state.monthIndex++; renderCarousel(sessions); }
    if(dx > 0 && idx > 0){ state.monthIndex--; renderCarousel(sessions); }
  }, {passive:true});
}

async function toggleCheckIn(session, sessions, $btn){
  if(state.checkInPending) return; // 전송 중 이중 탭 방지
  const member = state.selectedMember;

  state.checkInPending = true;
  const $card = $btn ? $btn.closest(".month-card") : null;
  const $prev = document.getElementById("prevBtn");
  const $next = document.getElementById("nextBtn");
  if($card) $card.classList.add("loading");
  if($btn){ $btn.disabled = true; $btn.textContent = "처리 중..."; }
  if($prev) $prev.disabled = true;
  if($next) $next.disabled = true;

  try{
    const res = await api("checkIn", { memberId: member.id, sessionId: session.id });
    // attendance 로컬 상태 갱신
    state.attendance = state.attendance.filter(a => !(a.memberId === member.id && a.sessionId === session.id));
    if(res.checked){
      state.attendance.push({ memberId: member.id, sessionId: session.id, month: session.month });
      showToast("체크 완료! 🎉");
      launchConfetti($btn);
    } else {
      showToast("체크를 취소했어요");
    }
  }catch(err){
    showToast("오류: " + err.message, 2600);
  }finally{
    state.checkInPending = false;
    renderDetail(sessions);
  }
}

/* =========================================================
   체크인 성공 시 폭죽(컨페티) 효과
========================================================= */
function launchConfetti(originEl){
  const rect = originEl && originEl.getBoundingClientRect ? originEl.getBoundingClientRect() : null;
  const originX = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
  const originY = rect ? rect.top + rect.height / 2 : window.innerHeight / 2;

  const colors = ["#ff6f9c", "#8b6ef2", "#ffc94a", "#4ade80", "#38bdf8", "#ff4f86"];
  const layer = document.createElement("div");
  layer.className = "confetti-layer";
  document.body.appendChild(layer);

  const count = 28;
  for(let i = 0; i < count; i++){
    const piece = document.createElement("span");
    piece.className = "confetti-piece";
    const angle = Math.random() * Math.PI * 2;
    const distance = 70 + Math.random() * 150;
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance - 50; // 위쪽으로 살짝 편향
    const size = 6 + Math.random() * 6;
    piece.style.left = originX + "px";
    piece.style.top = originY + "px";
    piece.style.width = size + "px";
    piece.style.height = (size * 0.4) + "px";
    piece.style.background = colors[i % colors.length];
    piece.style.setProperty("--dx", dx + "px");
    piece.style.setProperty("--dy", dy + "px");
    piece.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    piece.style.animationDelay = (Math.random() * 80) + "ms";
    layer.appendChild(piece);
  }

  setTimeout(() => layer.remove(), 1300);
}

      if(!member) return;
      if(!confirm(member.name + "님을 강퇴 처리할까요?")) return;
      setBtnLoading(btn, "처리 중...");
      try{
        await api("removeMember", { adminToken: state.adminToken, memberId: id });
        showToast(member.name + "님을 강퇴했어요");
        await refreshAll();
        openAdminPanel();
      }catch(err){
        resetBtnLoading(btn);
        handleAdminError(err);
      }
    });
  });
}

function handleAdminError(err){
  if(String(err.message).includes("INVALID_ADMIN")){
    showToast("비밀번호가 올바르지 않아요 🔒", 2400);
    state.adminToken = null;
    closeOverlay();
  }else{
    showToast("오류: " + err.message, 2600);
  }
}

async function refreshAll(){
  await loadData();
  if(state.selectedMember){
    const m = state.members.find(x => x.id === state.selectedMember.id);
    if(m) openDetail(m); else renderMain();
  }else{
    renderMain();
  }
}

/* =========================================================
   초기화
========================================================= */
async function init(){
  try{
    await loadData();
    renderMain();
  }catch(err){
    $content.innerHTML = `
      <div class="error-box">
        데이터를 불러오지 못했어요 🥲<br/>
        (${escapeHtml(err.message)})<br/>
        <button class="btn btn-secondary" id="retryBtn">다시 시도</button>
      </div>
    `;
    document.getElementById("retryBtn").addEventListener("click", init);
  }
}

init();
</script>
</body>
</html>
